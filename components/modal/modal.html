<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal — DS estudo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="stylesheet" href="modal.css" />
  <style>
    body { font-family: var(--font-family-title-text); padding: 40px; background:#eee; }
    .stage { max-width: 440px; }
    .slot-demo { border:1px dashed #000; min-height:106px; width:100%; box-sizing:border-box; }
  </style>
  <link rel="stylesheet" href="../../ds/ds.css" />
</head>
<body>
  <h2 style="color:#111;">Modal</h2>
  <!-- data-ds-injected -->
  <!-- ============ DEMO FUNCIONAL (runtime DS) ============ -->
  <section style="margin:0 0 40px;padding:20px 24px;border:1px solid var(--border-default,#e5e5e5);background:var(--background-bg-aux,#fafafa);">
    <p style="margin:0 0 16px;font:700 12px/1 var(--font-family-title-text);letter-spacing:.04em;text-transform:uppercase;color:var(--content-primary,#111);">▶ Funcional — botão abre; ✕, backdrop ou Esc fecham</p>
    
    <button class="btn btn--primary" data-ds-open="live-modal">Abrir modal</button>
    <div class="modal" id="live-modal" data-ds="modal">
      <div class="modal__header"><h3 class="modal__title">Confirmar ação</h3><button class="modal__close" aria-label="Fechar"><svg><use href="#ico-close"/></svg></button></div>
      <div class="modal__content"><p style="margin:0;font:400 16px/1.5 var(--font-family-title-text);color:var(--content-text);">Tem certeza que deseja continuar? Esta ação pode ser desfeita depois.</p></div>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="DS.closeModal(document.getElementById('live-modal'))">Cancelar</button>
        <button class="btn btn--destructive" onclick="DS.closeModal(document.getElementById('live-modal'))">Confirmar</button>
      </div>
    </div>
  </section>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="ico-close" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414L13.414 12l4.95 4.95-1.414 1.414L12 13.414l-4.95 4.95-1.414-1.414L10.586 12 5.636 7.05 7.05 5.636z"/></symbol>
    <symbol id="ico-arrow-right-s" viewBox="0 0 24 24" fill="currentColor"><path d="M13.172 12 8.222 7.05l1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/></symbol>
  </svg>

  <div class="stage">
    <div class="modal" data-node-id="1:5697">
      <div class="modal__header">
        <h3 class="modal__title">Titulo</h3>
        <button class="modal__close" aria-label="Fechar"><svg><use href="#ico-close"/></svg></button>
      </div>
      <div class="modal__content">
        <div class="modal__slot"><div class="slot-demo"></div></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost">Ghost<span class="btn__icon btn__icon--lg"><svg><use href="#ico-arrow-right-s"/></svg></span></button>
        <button class="btn btn--destructive">Destructive</button>
      </div>
    </div>
  </div>
  <script src="../../ds/ds.js" defer></script>
</body>
</html>
