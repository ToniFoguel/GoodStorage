<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar — DS estudo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="avatar.css" />
  <style>
    body { font-family: var(--font-family-title-text); padding: 32px; background:#fafafa; }
    .row { display:flex; gap:24px; align-items:center; margin-bottom:24px; }
    .row span { font-size:12px; color:#666; }
  </style>
</head>
<body>
  <h2>Avatar</h2>

  <div class="row">
    <!-- Variante Image (Figma type=Image, node 1:189) -->
    <div class="avatar avatar--image" data-node-id="1:189">
      <img class="avatar__img" src="../../assets/avatar-sample.png" alt="Foto de perfil" />
    </div>
    <span>type = Image</span>
  </div>

  <div class="row">
    <!-- Variante Text (Figma type=Text, node 1:191) -->
    <div class="avatar avatar--text" data-node-id="1:191">
      <p class="avatar__label text-label-regular" data-node-id="1:192">AT</p>
    </div>
    <span>type = Text</span>
  </div>
</body>
</html>
