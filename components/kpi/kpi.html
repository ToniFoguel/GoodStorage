<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI — DS estudo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="kpi.css" />
  <style>body{font-family:var(--font-family-title-text);padding:40px;background:#fff}*{box-sizing:border-box}</style>
</head>
<body>
  <h2>KPI</h2>
  <p style="color:#666;font-size:13px;max-width:520px">Card de métrica. Use vários dentro de <code>.kpis</code> (grade fluida). Valor longo usa <code>.kpi__value--sm</code>.</p>

  <div class="kpis" style="max-width:720px">
    <div class="kpi"><p class="kpi__label">Tempo de casa</p><p class="kpi__value">4a 5m</p></div>
    <div class="kpi"><p class="kpi__label">Boxes ativos</p><p class="kpi__value">1</p></div>
    <div class="kpi"><p class="kpi__label">Adimplência</p><p class="kpi__value">100%</p></div>
    <div class="kpi"><p class="kpi__label">Seguro</p><p class="kpi__value kpi__value--sm">MAPFRE · R$ 1.500</p></div>
  </div>
</body>
</html>
