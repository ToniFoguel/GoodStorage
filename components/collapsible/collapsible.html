<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collapsible — DS estudo</title>
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="collapsible.css" />
  <style>
    body { font-family: var(--font-family-title-text); padding: 40px; background:#fff; }
    .row { display:flex; gap:32px; flex-wrap:wrap; align-items:flex-start; }
    .col { display:flex; flex-direction:column; gap:20px; width:420px; }
    .col > small { font-size:11px; color:#999; }
    .placeholder { color:#bbb; font-size:14px; }
    .demo-h { min-height: 180px; }
  </style>
  <link rel="stylesheet" href="../../ds/ds.css" />
</head>
<body>
  <h2>Collapsible</h2>
  <!-- data-ds-injected -->
  <!-- ============ DEMO FUNCIONAL (runtime DS) ============ -->
  <section style="margin:0 0 40px;padding:20px 24px;border:1px solid var(--border-default,#e5e5e5);background:var(--background-bg-aux,#fafafa);">
    <p style="margin:0 0 16px;font:700 12px/1 var(--font-family-title-text);letter-spacing:.04em;text-transform:uppercase;color:var(--content-primary,#111);">▶ Funcional — clique no cabeçalho para expandir/recolher</p>
    
    <div style="width:420px;">
      <div class="collapsible is-open" data-ds="collapsible">
        <button class="collapsible__header" type="button" aria-expanded="true">
          <h3 class="collapsible__title">Detalhes do pedido</h3>
          <span class="collapsible__icon collapsible__icon--up"><svg><use href="#ico-arrow-up-s"/></svg></span>
          <span class="collapsible__icon collapsible__icon--down"><svg><use href="#ico-arrow-down-s"/></svg></span>
        </button>
        <div class="collapsible__content"><div class="collapsible__slot"><p style="color:#777;font-size:14px;margin:0;">Conteúdo revelado quando aberto.</p></div></div>
      </div>
    </div>
  </section>

  <!-- Ícones remix -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="ico-arrow-up-s" viewBox="0 0 24 24" fill="currentColor"><path d="M11.9997 10.8284 7.04996 15.7782 5.63574 14.364 11.9997 8 18.3637 14.364 16.9495 15.7782z"/></symbol>
    <symbol id="ico-arrow-down-s" viewBox="0 0 24 24" fill="currentColor"><path d="M11.9997 13.1714 16.9495 8.22168 18.3637 9.63589 11.9997 15.9999 5.63574 9.63589 7.04996 8.22168z"/></symbol>
  </svg>

  <div class="row">
    <!-- Desktop/Tablet -->
    <div class="col">
      <small>displayport = Desktop/Tablet</small>
      <div class="collapsible is-open" data-node-id="1:1070">
        <button class="collapsible__header" type="button" aria-expanded="true">
          <h3 class="collapsible__title">Title 3</h3>
          <span class="collapsible__icon collapsible__icon--up"><svg><use href="#ico-arrow-up-s"/></svg></span>
          <span class="collapsible__icon collapsible__icon--down"><svg><use href="#ico-arrow-down-s"/></svg></span>
        </button>
        <div class="collapsible__content demo-h">
          <div class="collapsible__slot"><p class="placeholder">Slot — conteúdo</p></div>
        </div>
      </div>

      <div class="collapsible" data-node-id="1:1080">
        <button class="collapsible__header" type="button" aria-expanded="false">
          <h3 class="collapsible__title">Title 3</h3>
          <span class="collapsible__icon collapsible__icon--up"><svg><use href="#ico-arrow-up-s"/></svg></span>
          <span class="collapsible__icon collapsible__icon--down"><svg><use href="#ico-arrow-down-s"/></svg></span>
        </button>
        <div class="collapsible__content demo-h">
          <div class="collapsible__slot"><p class="placeholder">Slot — conteúdo</p></div>
        </div>
      </div>
    </div>

    <!-- Mobile -->
    <div class="col">
      <small>displayport = Mobile</small>
      <div class="collapsible collapsible--mobile is-open" data-node-id="1:1075">
        <button class="collapsible__header" type="button" aria-expanded="true">
          <h3 class="collapsible__title">Title 3</h3>
          <span class="collapsible__icon collapsible__icon--up"><svg><use href="#ico-arrow-up-s"/></svg></span>
          <span class="collapsible__icon collapsible__icon--down"><svg><use href="#ico-arrow-down-s"/></svg></span>
        </button>
        <div class="collapsible__content demo-h">
          <div class="collapsible__slot"><p class="placeholder">Slot — conteúdo</p></div>
        </div>
      </div>

      <div class="collapsible collapsible--mobile" data-node-id="1:1084">
        <button class="collapsible__header" type="button" aria-expanded="false">
          <h3 class="collapsible__title">Title 3</h3>
          <span class="collapsible__icon collapsible__icon--up"><svg><use href="#ico-arrow-up-s"/></svg></span>
          <span class="collapsible__icon collapsible__icon--down"><svg><use href="#ico-arrow-down-s"/></svg></span>
        </button>
        <div class="collapsible__content demo-h">
          <div class="collapsible__slot"><p class="placeholder">Slot — conteúdo</p></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* galeria estática: componentes com [data-ds] são geridos pelo runtime */
    document.querySelectorAll('.collapsible:not([data-ds]) .collapsible__header').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var root = btn.closest('.collapsible');
        var open = root.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });
  </script>
  <script src="../../ds/ds.js" defer></script>
</body>
</html>
